name: INTERLOCK CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/**"]

jobs:
  verify:
    name: Build, Lint & Test Pipeline
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      ADMIN_API_KEY: interlock-test-key-32chars-min-length-secure
      REALTIME_TOKEN: interlock-test-realtime-token-secure
      SESSION_SECRET: interlock-test-session-secret-key-64chars
      DATABASE_URL: "file:./test.db"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run db:generate

      - name: Setup test database schema
        run: bun run db:push

      - name: Run Test Suite
        run: bun test

      - name: TypeScript Static Typecheck
        run: bun x tsc --noEmit

      - name: Next.js Production Build
        run: bun run build
